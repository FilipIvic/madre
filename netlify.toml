[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # A public address shown on the site itself (footer, legal pages, structured
  # data), so the secrets scanner must not treat it as a secret.
  SECRETS_SCAN_OMIT_KEYS = "OWNER_EMAIL"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Reservation API. Must come BEFORE the SPA fallback below — Netlify applies
# the first matching rule, so without this /api/* would render index.html.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback so client-side routes (e.g. /politika-privatnosti) resolve
# on direct load and refresh instead of 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
