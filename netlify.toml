[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned to an exact release. A bare "22" resolves to the newest 22.x, and when
  # that is only days old Netlify has no prebuilt binary and compiles Node from
  # source, which blows the build timeout.
  NODE_VERSION = "22.23.2"
  # A public address shown on the site itself (footer, legal pages, structured
  # data), so the secrets scanner must not treat it as a secret.
  SECRETS_SCAN_OMIT_KEYS = "OWNER_EMAIL"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Send the old Netlify address to the real domain so Google and old links
# settle on one canonical site.
[[redirects]]
  from = "https://madrebistro.netlify.app/*"
  to = "https://madre-bistro.com/:splat"
  status = 301
  force = true

# Reservation API. Must come BEFORE the SPA fallback below — Netlify applies
# the first matching rule, so without this /api/* would render index.html.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback so client-side routes (e.g. /politika-privatnosti) resolve
# on direct load and refresh instead of 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
